<!doctype html>
<html lang="pt-BR" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/images/icons/android/android-launchericon-48-48.png"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/images/icons/ios/192.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

    <meta name="theme-color" content="#154BD4" />
    <meta
      name="description"
      content="RevWay CRM: o CRM da RevWay para organizar contatos, empresas e oportunidades."
    />
    <meta
      property="og:image"
      content="https://crm.revway.com.br/images/revway/og.png"
    />
    <meta
      property="og:description"
      content="RevWay CRM: o CRM da RevWay para organizar contatos, empresas e oportunidades."
    />
    <meta property="og:title" content="RevWay CRM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://crm.revway.com.br/images/revway/og.png"
    />

    <meta
      name="twitter:description"
      content="RevWay CRM: o CRM da RevWay para organizar contatos, empresas e oportunidades."
    />
    <meta name="twitter:title" content="RevWay CRM" />
    <title>RevWay CRM</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      /* react-data-grid declares its layer when it loads; keep it below twenty-ui. */
      @layer rdg, twenty-ui;

      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #1b1b1b;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #fcfcfc;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
