# RevWay CRM — staging
# Segredos (fly secrets): PG_DATABASE_URL, REDIS_URL, ENCRYPTION_KEY,
#   AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (setados por `fly storage create`),
#   EMAIL_SMTP_PASSWORD
app = "revway-crm-staging"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "120s"

[build]
  image = "twentycrm/twenty:v2.62.0"

[deploy]
  # Migrações + registro de crons uma vez por deploy (não em todo boot).
  release_command = "sh -c 'DISABLE_DB_MIGRATIONS=false DISABLE_CRON_JOBS_REGISTRATION=false /app/entrypoint.sh true'"
  release_command_timeout = "20m"
  strategy = "rolling"

  [deploy.release_command_vm]
    size = "shared-cpu-2x"
    memory = "2gb"

[env]
  NODE_ENV = "production"
  NODE_PORT = "3000"
  SERVER_URL = "https://revway-crm-staging.fly.dev"
  DISABLE_DB_MIGRATIONS = "true"
  DISABLE_CRON_JOBS_REGISTRATION = "true"
  PG_SSL_ALLOW_SELF_SIGNED = "true"
  STORAGE_TYPE = "s3"
  STORAGE_S3_REGION = "auto"
  STORAGE_S3_ENDPOINT = "https://fly.storage.tigris.dev"
  STORAGE_S3_NAME = "revway-crm-staging-files"
  # trocar para "smtp" quando EMAIL_SMTP_PASSWORD (API key Resend) estiver setado
  EMAIL_DRIVER = "logger"
  EMAIL_SMTP_HOST = "smtp.resend.com"
  EMAIL_SMTP_PORT = "465"
  EMAIL_SMTP_USER = "resend"
  EMAIL_FROM_ADDRESS = "crm@revway.com.br"
  EMAIL_FROM_NAME = "RevWay CRM"
  TELEMETRY_ENABLED = "false"
  ANALYTICS_ENABLED = "false"
  ALLOW_REQUESTS_TO_TWENTY_ICONS = "false"
  SIGN_IN_PREFILLED = "false"
  IS_EMAIL_VERIFICATION_REQUIRED = "false"
  IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS = "true"
  # Sem teto de workspaces (núcleo AGPL; ver revway/PLANO.md "Limite de workspaces")
  MAX_WORKSPACES_WITHOUT_ENTERPRISE_KEY = "0"

[processes]
  app = "node dist/main"
  worker = "yarn worker:prod"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["worker"]
